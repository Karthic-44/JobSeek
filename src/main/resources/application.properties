spring.application.name=JobSeekingPlatform

# Database (override with environment variables; use the "dev" profile for a zero-setup in-memory H2 db)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobseek}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Origin of the React app (no trailing slash)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT. Set JWT_SECRET to a long random string (at least 32 characters) in any real deployment.
spring.app.jwtSecret=${JWT_SECRET:change-me-before-deploying-this-is-only-a-development-secret-0123456789}
spring.app.jwtExpirationMs=86400000
spring.app.jwtCookieName=springBootJobSeek
# Set to true when serving over HTTPS
spring.app.jwtCookieSecure=${JWT_COOKIE_SECURE:false}

# Seeds demo accounts (admin / recruiter / user). Turn off in production.
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.seed-admin-password=${ADMIN_PASSWORD:admin123}
